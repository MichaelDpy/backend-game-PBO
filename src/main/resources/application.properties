spring.application.name=backend

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Datasource - File-based H2 (data persisten)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:lawnmowerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
# Disable SQL logging di production untuk reduce log rate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# Server port
server.port=${PORT:8080}

# JWT — nilai default untuk development lokal
# Di production (Railway), set environment variable JWT_SECRET dengan nilai yang kuat
jwt.secret=${JWT_SECRET:local-dev-secret-key-minimum-32-chars-long}
jwt.expiration-ms=86400000

# Logging Configuration
# Set logging level to WARN untuk production (reduce log volume)
logging.level.root=${LOG_LEVEL_ROOT:WARN}
logging.level.org.springframework=${LOG_LEVEL_SPRING:WARN}
logging.level.org.hibernate=${LOG_LEVEL_HIBERNATE:WARN}
logging.level.org.example.backend=${LOG_LEVEL_APP:INFO}

# Disable unnecessary Spring Boot banners and startup info
spring.main.banner-mode=off
logging.level.org.springframework.boot.autoconfigure=ERROR

# Disable WebSocket debug logging
logging.level.org.springframework.web.socket=WARN
logging.level.org.springframework.messaging=WARN

# Disable Tomcat access logs
server.tomcat.accesslog.enabled=false

# Async logging for better performance (optional)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
